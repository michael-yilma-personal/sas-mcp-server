apiVersion: v1
kind: Service
metadata:
  name: {{ include "sas-mcp-server.fullname" . }}
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sas-mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sas-mcp-server.serviceAccountName" . }}
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls Viya over HTTPS and never touches the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
