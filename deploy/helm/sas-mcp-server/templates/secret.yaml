{{- if .Values.signingKey.value -}}
{{/*
Only rendered when a key is passed through values. Prefer
signingKey.existingSecret so the key never lands in a values file, a chart
release object, or version control.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sas-mcp-server.fullname" . }}-signing
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  signing-key: {{ .Values.signingKey.value | quote }}
{{- end }}
{{- if and .Values.persistence.enabled (eq .Values.persistence.type "pvc") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sas-mcp-server.fullname" . }}-state
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.size }}
  {{- with .Values.persistence.pvc.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- if and .Values.telemetry.enabled (eq .Values.telemetry.persistence.type "pvc") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sas-mcp-server.fullname" . }}-telemetry
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.telemetry.persistence.pvc.size }}
  {{- with .Values.telemetry.persistence.pvc.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
